[project]
name = "stock-tracker"
version = "0.1.0"
description = "Private Indian stock market tracking application"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "gunicorn==26.2.0",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg2-binary==2.9.12",
    "pandas==3.0.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "bcrypt==5.0.0",
    "pyjwt==2.13.0",
    "openai==3.6.0",
    "boto3==1.43.83",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E (pycodestyle) + F (pyflakes) only -- unused imports, undefined names, syntax
# issues, that class of real bug. Deliberately excludes E501 (line length) and
# stricter/stylistic rule sets (import sorting, pyupgrade, bugbear, ...): this
# codebase has no established line-length or import-order convention, and
# turning those on would mean a mass reformat instead of a reviewable diff.
# Revisit once there's an actual formatter in the loop.
select = ["E", "F"]
ignore = ["E501"]
