[project]
name = "stock-tracker"
version = "0.1.0"
description = "Private Indian stock market tracking application"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "pandas",
    "pydantic-settings",
    "httpx",
    "python-dotenv",
    "bcrypt",
    "pyjwt",
    "openai",
    "boto3",
    "pypdf",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pip-audit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E (pycodestyle) + F (pyflakes) only -- unused imports, undefined names, syntax
# issues, that class of real bug. Deliberately excludes E501 (line length) and
# stricter/stylistic rule sets (import sorting, pyupgrade, bugbear, ...): this
# codebase has no established line-length or import-order convention, and
# turning those on would mean a mass reformat instead of a reviewable diff.
# Revisit once there's an actual formatter in the loop.
select = ["E", "F"]
ignore = ["E501"]
