[project]
name = "stock-tracker"
version = "0.1.0"
description = "Private Indian stock market tracking application"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "pandas",
    "pydantic-settings",
    "httpx",
    "python-dotenv",
    "bcrypt",
    "pyjwt",
    "openai",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
